[package]
name = "db2pg"
version = "0.1.0"
edition = "2021"
description = "DB2 to PostgreSQL SQL migration tool"
license = "MIT"

[[bin]]
name = "db2pg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
diff = "0.1"
colored = "2.1"
