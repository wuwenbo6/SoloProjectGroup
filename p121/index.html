<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纤维图像分析系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 12px 24px;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .tab:hover {
            transform: translateY(-2px);
        }
        .content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            background: #f8f9ff;
        }
        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .file-input {
            display: none;
        }
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
        }
        .btn-success {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
        }
        .result-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .ratio-bar {
            height: 20px;
            border-radius: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin: 5px 0;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
        }
        .history-table th,
        .history-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }
        .history-table th {
            background: #f8f9fa;
            font-weight: 600;
        }
        .history-table tr:hover {
            background: #f8f9ff;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            opacity: 0.9;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .preview-image {
            max-width: 200px;
            max-height: 200px;
            margin-top: 15px;
            border-radius: 8px;
        }
        .impurity-tag {
            display: inline-block;
            padding: 4px 10px;
            background: #ff6b6b;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin: 2px;
        }
        .level-A { background: #51cf66; color: white; }
        .level-B { background: #82c91e; color: white; }
        .level-C { background: #fab005; color: white; }
        .level-D { background: #fd7e14; color: white; }
        .level-E { background: #ff6b6b; color: white; }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .file-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 15px 0;
            border: 1px solid #e9ecef;
            border-radius: 8px;
        }
        .file-item {
            padding: 10px 15px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .progress-container {
            margin: 15px 0;
        }
        .progress-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }
        .input-group {
            margin: 15px 0;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .input-group textarea {
            min-height: 100px;
            font-family: monospace;
        }
        .compare-table {
            margin-top: 20px;
            overflow-x: auto;
        }
        .recommendation-list {
            margin: 10px 0;
            padding-left: 20px;
        }
        .recommendation-list li {
            padding: 5px 0;
            color: #555;
        }
        .severity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 纤维图像分析系统</h1>
            <p>纤维图像上传、配比分析、强度计算、杂质检测</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('upload')">单图分析</button>
            <button class="tab" onclick="switchTab('batch')">批量分析</button>
            <button class="tab" onclick="switchTab('compare')">批次对比</button>
            <button class="tab" onclick="switchTab('history')">历史记录</button>
            <button class="tab" onclick="switchTab('trace')">杂质溯源</button>
            <button class="tab" onclick="switchTab('stats')">统计概览</button>
            <button class="tab" onclick="switchTab('model')">模型配置</button>
        </div>

        <div class="content">
            <div id="upload" class="tab-content active">
                <h2>单图分析</h2>
                <div class="upload-area" onclick="document.getElementById('singleFile').click()" id="singleUploadArea">
                    <div class="upload-icon">📁</div>
                    <p>点击或拖拽上传纤维图像</p>
                    <p style="color: #666; font-size: 14px; margin-top: 10px;">支持 JPG、PNG 格式</p>
                </div>
                <input type="file" id="singleFile" class="file-input" accept="image/*" onchange="handleSingleUpload(this)">
                <div id="singlePreview"></div>
                <button class="btn" id="analyzeBtn" onclick="analyzeSingle()" disabled>开始分析</button>
                <div class="loading" id="singleLoading">
                    <div class="spinner"></div>
                    <p>正在分析中...</p>
                </div>
                <div id="singleResult"></div>
                <div id="singleError"></div>
            </div>

            <div id="batch" class="tab-content">
                <h2>批量分析</h2>
                <div class="upload-area" onclick="document.getElementById('batchFiles').click()" id="batchUploadArea">
                    <div class="upload-icon">📂</div>
                    <p>点击或拖拽上传多张图像</p>
                    <p style="color: #666; font-size: 14px; margin-top: 10px;">支持同时上传最多20张图片</p>
                </div>
                <input type="file" id="batchFiles" class="file-input" accept="image/*" multiple onchange="handleBatchUpload(this)">
                <div id="batchPreview"></div>
                <button class="btn" id="batchAnalyzeBtn" onclick="analyzeBatch()" disabled>批量分析</button>
                <div class="loading" id="batchLoading">
                    <div class="spinner"></div>
                    <p>正在批量分析中...</p>
                </div>
                <div id="batchResult"></div>
                <div id="batchError"></div>
            </div>

            <div id="compare" class="tab-content">
                <h2>批次对比</h2>
                <div class="input-group">
                    <label>批次ID（多个批次用逗号分隔）</label>
                    <input type="text" id="compareBatchIds" placeholder="例如: batch_id1, batch_id2">
                </div>
                <button class="btn" onclick="compareBatches()">开始对比</button>
                <div class="loading" id="compareLoading">
                    <div class="spinner"></div>
                    <p>正在对比中...</p>
                </div>
                <div id="compareResult"></div>
                <div id="compareError"></div>
            </div>

            <div id="history" class="tab-content">
                <h2>历史记录</h2>
                <div class="input-group" style="display: inline-block; width: auto; margin-right: 10px;">
                    <label>按等级筛选</label>
                    <select id="levelFilter" onchange="loadHistory()" style="padding: 8px; border-radius: 6px;">
                        <option value="">全部</option>
                        <option value="A">特级(A)</option>
                        <option value="B">一级(B)</option>
                        <option value="C">二级(C)</option>
                        <option value="D">三级(D)</option>
                        <option value="E">不合格(E)</option>
                    </select>
                </div>
                <button class="btn" onclick="loadHistory()">刷新记录</button>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>文件名</th>
                            <th>强度</th>
                            <th>等级</th>
                            <th>杂质数</th>
                            <th>批次ID</th>
                            <th>分析时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                    </tbody>
                </table>
            </div>

            <div id="trace" class="tab-content">
                <h2>杂质溯源</h2>
                <div class="input-group">
                    <label>记录ID</label>
                    <input type="number" id="traceRecordId" placeholder="输入要溯源的记录ID">
                </div>
                <button class="btn" onclick="traceImpurity()">开始溯源</button>
                <div class="loading" id="traceLoading">
                    <div class="spinner"></div>
                    <p>正在溯源分析中...</p>
                </div>
                <div id="traceResult"></div>
                <div id="traceError"></div>
            </div>

            <div id="stats" class="tab-content">
                <h2>统计概览</h2>
                <div class="stats-grid" id="statsGrid">
                </div>
                <div id="levelDistribution"></div>
            </div>

            <div id="model" class="tab-content">
                <h2>模型配置管理</h2>
                <h3 style="margin: 20px 0 10px;">当前配置</h3>
                <div id="currentConfig"></div>

                <h3 style="margin: 30px 0 10px;">版本列表</h3>
                <button class="btn" onclick="loadModelVersions()">刷新版本列表</button>
                <table class="history-table" id="versionTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>版本号</th>
                            <th>状态</th>
                            <th>描述</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="versionTableBody">
                    </tbody>
                </table>

                <h3 style="margin: 30px 0 10px;">创建新版本</h3>
                <div class="input-group">
                    <label>版本号</label>
                    <input type="text" id="newVersion" placeholder="例如: v1.2.0">
                </div>
                <div class="input-group">
                    <label>描述</label>
                    <input type="text" id="versionDesc" placeholder="版本描述说明">
                </div>
                <div class="input-group">
                    <label>强度阈值配置 (JSON格式)</label>
                    <textarea id="strengthThresholds" placeholder='{"A": {"min": 5.5, "name": "特级"}, ...}'></textarea>
                </div>
                <div class="input-group">
                    <label>纤维颜色范围配置 (JSON格式)</label>
                    <textarea id="fiberColorRanges" placeholder='{"cotton": {"lower": [...], "upper": [...]}, ...}'></textarea>
                </div>
                <div class="input-group">
                    <label>杂质分类器配置 (JSON格式)</label>
                    <textarea id="impurityClassifier" placeholder='{"particle": {"sources": [...]}, ...}'></textarea>
                </div>
                <button class="btn btn-success" onclick="saveNewConfig()">保存新版本</button>
                <button class="btn" onclick="fillDefaultConfig()">填充默认配置</button>
                <div id="modelResult"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';

        const LEVEL_NAMES = {
            'A': '特级',
            'B': '一级',
            'C': '二级',
            'D': '三级',
            'E': '不合格'
        };

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');

            if (tabName === 'history') loadHistory();
            if (tabName === 'stats') loadStats();
            if (tabName === 'model') loadModelConfig();
        }

        function handleDragOver(e, areaId) {
            e.preventDefault();
            document.getElementById(areaId).classList.add('dragover');
        }

        function handleDragLeave(e, areaId) {
            e.preventDefault();
            document.getElementById(areaId).classList.remove('dragover');
        }

        function handleDrop(e, type) {
            e.preventDefault();
            document.getElementById(type + 'UploadArea').classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (type === 'single' && files.length > 0) {
                document.getElementById('singleFile').files = files;
                handleSingleUpload({ files: [files[0]] });
            } else if (type === 'batch') {
                document.getElementById('batchFiles').files = files;
                handleBatchUpload({ files });
            }
        }

        ['single', 'batch'].forEach(type => {
            const area = document.getElementById(type + 'UploadArea');
            area.addEventListener('dragover', (e) => handleDragOver(e, type + 'UploadArea'));
            area.addEventListener('dragleave', (e) => handleDragLeave(e, type + 'UploadArea'));
            area.addEventListener('drop', (e) => handleDrop(e, type));
        });

        let currentSingleFile = null;

        function handleSingleUpload(input) {
            const file = input.files ? input.files[0] : input[0];
            currentSingleFile = file;
            const preview = document.getElementById('singlePreview');
            preview.innerHTML = `
                <img src="${URL.createObjectURL(file)}" class="preview-image" alt="预览">
                <p style="margin-top: 10px;">已选择: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)</p>
            `;
            document.getElementById('analyzeBtn').disabled = false;
            document.getElementById('singleResult').innerHTML = '';
            document.getElementById('singleError').innerHTML = '';
        }

        async function analyzeSingle() {
            if (!currentSingleFile) return;

            document.getElementById('singleLoading').classList.add('show');
            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('singleResult').innerHTML = '';
            document.getElementById('singleError').innerHTML = '';

            const formData = new FormData();
            formData.append('file', currentSingleFile);

            try {
                const response = await fetch(`${API_BASE}/api/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP ${response.status}`);
                }

                const result = await response.json();
                displaySingleResult(result);
            } catch (error) {
                document.getElementById('singleError').innerHTML = `
                    <div class="alert alert-error">
                        <strong>分析失败:</strong> ${error.message}
                    </div>
                `;
            } finally {
                document.getElementById('singleLoading').classList.remove('show');
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        function displaySingleResult(result) {
            const fiberRatio = JSON.parse(result.fiber_type_ratio);
            const resultDiv = document.getElementById('singleResult');

            let ratioHtml = '';
            for (const [fiber, ratio] of Object.entries(fiberRatio)) {
                ratioHtml += `
                    <div class="result-item">
                        <span>${getFiberName(fiber)}</span>
                        <span>${ratio}%</span>
                    </div>
                    <div class="ratio-bar" style="width: ${Math.min(100, ratio)}%"></div>
                `;
            }

            resultDiv.innerHTML = `
                <div class="result-card">
                    <h3 style="margin-bottom: 15px;">✅ 分析完成</h3>
                    <p>记录ID: ${result.id} | 批次ID: ${result.batch_id || '无'}</p>

                    <h4 style="margin: 15px 0 10px;">纤维配比</h4>
                    ${ratioHtml}

                    <h4 style="margin: 15px 0 10px;">强度计算</h4>
                    <div class="result-item">
                        <span>纤维强度指数</span>
                        <strong>${result.strength}</strong>
                    </div>
                    <div class="result-item">
                        <span>质量等级</span>
                        <span class="impurity-tag level-${result.strength_level}">
                            ${result.strength_level} - ${LEVEL_NAMES[result.strength_level] || result.strength_level}
                        </span>
                    </div>

                    <h4 style="margin: 15px 0 10px;">杂质检测</h4>
                    <div class="result-item">
                        <span>检测到杂质</span>
                        <span class="impurity-tag">${result.impurity_count} 个</span>
                    </div>

                    <p style="color: #666; font-size: 12px; margin-top: 10px;">
                        分析时间: ${new Date(result.created_at).toLocaleString()}
                    </p>
                </div>
            `;
        }

        let currentBatchFiles = [];

        function handleBatchUpload(input) {
            const files = Array.from(input.files);
            if (files.length > 20) {
                document.getElementById('batchError').innerHTML = `
                    <div class="alert alert-warning">
                        <strong>警告:</strong> 最多支持上传20个文件，已自动截断
                    </div>
                `;
                files.splice(20);
            }
            currentBatchFiles = files;
            const preview = document.getElementById('batchPreview');
            preview.innerHTML = `<p style="margin-bottom: 10px;">已选择 ${files.length} 个文件:</p><div class="file-list">`;

            files.forEach((file, idx) => {
                preview.innerHTML += `
                    <div class="file-item">
                        <span>${idx + 1}. ${file.name}</span>
                        <span>(${(file.size / 1024).toFixed(1)} KB)</span>
                    </div>
                `;
            });

            preview.innerHTML += '</div>';

            document.getElementById('batchAnalyzeBtn').disabled = files.length === 0;
            document.getElementById('batchResult').innerHTML = '';
        }

        async function analyzeBatch() {
            if (currentBatchFiles.length === 0) return;

            document.getElementById('batchLoading').classList.add('show');
            document.getElementById('batchAnalyzeBtn').disabled = true;
            document.getElementById('batchResult').innerHTML = '';
            document.getElementById('batchError').innerHTML = '';

            const formData = new FormData();
            currentBatchFiles.forEach(file => formData.append('files', file));

            try {
                const response = await fetch(`${API_BASE}/api/batch`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP ${response.status}`);
                }

                const result = await response.json();
                displayBatchResult(result);
            } catch (error) {
                document.getElementById('batchError').innerHTML = `
                    <div class="alert alert-error">
                        <strong>批量分析失败:</strong> ${error.message}
                    </div>
                `;
            } finally {
                document.getElementById('batchLoading').classList.remove('show');
                document.getElementById('batchAnalyzeBtn').disabled = false;
            }
        }

        function displayBatchResult(result) {
            const resultDiv = document.getElementById('batchResult');

            let alertHtml = '';
            if (result.total_errors > 0) {
                alertHtml = `
                    <div class="alert alert-warning">
                        <strong>注意:</strong> 有 ${result.total_errors} 个文件处理失败
                        <ul style="margin-top: 10px; padding-left: 20px;">
                            ${result.errors.map(e => `<li>${e}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            let tableRows = result.results.map((r, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${r.filename}</td>
                    <td>${r.strength}</td>
                    <td><span class="impurity-tag level-${r.strength_level}">${r.strength_level}</span></td>
                    <td>${r.impurity_count}</td>
                </tr>
            `).join('');

            resultDiv.innerHTML = `
                <div class="result-card">
                    <h3 style="margin-bottom: 15px;">✅ 批量分析完成</h3>
                    <p><strong>批次ID:</strong> ${result.batch_id}</p>
                    <p><strong>成功处理:</strong> ${result.total_files} 个文件</p>
                    ${alertHtml}
                    <table class="history-table" style="margin-top: 20px;">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>文件名</th>
                                <th>强度</th>
                                <th>等级</th>
                                <th>杂质数</th>
                            </tr>
                        </thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
            `;
        }

        async function compareBatches() {
            const batchIds = document.getElementById('compareBatchIds').value.trim();
            if (!batchIds) {
                document.getElementById('compareError').innerHTML = `
                    <div class="alert alert-error">请输入批次ID</div>
                `;
                return;
            }

            document.getElementById('compareLoading').classList.add('show');
            document.getElementById('compareResult').innerHTML = '';
            document.getElementById('compareError').innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/api/batch/compare?batch_ids=${encodeURIComponent(batchIds)}`);
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP ${response.status}`);
                }

                const result = await response.json();
                displayCompareResult(result);
            } catch (error) {
                document.getElementById('compareError').innerHTML = `
                    <div class="alert alert-error">
                        <strong>对比失败:</strong> ${error.message}
                    </div>
                `;
            } finally {
                document.getElementById('compareLoading').classList.remove('show');
            }
        }

        function displayCompareResult(result) {
            const resultDiv = document.getElementById('compareResult');

            let batchRows = result.batch_stats.map(batch => `
                <tr>
                    <td>${batch.batch_id.substring(0, 8)}...</td>
                    <td>${batch.sample_count}</td>
                    <td><strong>${batch.avg_strength}</strong></td>
                    <td>${batch.max_strength}</td>
                    <td>${batch.min_strength}</td>
                    <td>${batch.avg_impurity_count}</td>
                    <td>${Object.entries(batch.strength_level_distribution).map(([l, c]) => `${l}:${c}`).join(', ') || '-'}</td>
                </tr>
            `).join('');

            resultDiv.innerHTML = `
                <div class="result-card">
                    <h3 style="margin-bottom: 15px;">✅ 批次对比完成</h3>

                    <div class="alert alert-info">
                        <strong>摘要:</strong>
                        <ul style="margin-top: 10px; padding-left: 20px;">
                            <li>总对比样本数: ${result.summary.total_samples_compared}</li>
                            <li>整体平均强度: ${result.summary.overall_avg_strength}</li>
                            <li>最优批次: ${result.summary.best_batch.substring(0, 12)}...</li>
                            <li>最少杂质批次: ${result.summary.lowest_impurity_batch.substring(0, 12)}...</li>
                        </ul>
                    </div>

                    <h4 style="margin: 20px 0 10px;">批次详情对比</h4>
                    <div class="compare-table">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>批次ID</th>
                                    <th>样本数</th>
                                    <th>平均强度</th>
                                    <th>最大强度</th>
                                    <th>最小强度</th>
                                    <th>平均杂质</th>
                                    <th>等级分布</th>
                                </tr>
                            </thead>
                            <tbody>${batchRows}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        async function loadHistory() {
            const levelFilter = document.getElementById('levelFilter').value;
            try {
                let url = `${API_BASE}/api/history`;
                if (levelFilter) {
                    url += `?strength_level=${levelFilter}`;
                }
                const response = await fetch(url);
                const records = await response.json();

                const tbody = document.getElementById('historyTableBody');
                if (records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #999;">暂无历史记录</td></tr>';
                    return;
                }

                tbody.innerHTML = records.map(r => `
                    <tr>
                        <td>${r.id}</td>
                        <td>${r.filename}</td>
                        <td>${r.strength}</td>
                        <td><span class="impurity-tag level-${r.strength_level}">${r.strength_level}</span></td>
                        <td>${r.impurity_count}</td>
                        <td style="font-size: 12px; color: #666;">${r.batch_id ? r.batch_id.substring(0, 12) + '...' : '-'}</td>
                        <td>${new Date(r.created_at).toLocaleString()}</td>
                        <td>
                            <button onclick="viewDetail(${r.id})" style="padding: 5px 10px; margin-right: 5px;">详情</button>
                            <button onclick="traceImpurityById(${r.id})" style="padding: 5px 10px; margin-right: 5px; background: #fd7e14; color: white; border: none; border-radius: 4px; cursor: pointer;">溯源</button>
                            <button onclick="deleteRecord(${r.id})" class="btn-danger" style="padding: 5px 10px; color: white; border: none; border-radius: 4px; cursor: pointer;">删除</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('加载历史记录失败:', error);
                alert('加载历史记录失败: ' + error.message);
            }
        }

        async function viewDetail(id) {
            try {
                const response = await fetch(`${API_BASE}/api/history/${id}`);
                const record = await response.json();

                let ratioHtml = '';
                for (const [fiber, ratio] of Object.entries(record.fiber_type_ratio)) {
                    ratioHtml += `${getFiberName(fiber)}: ${ratio}%\n`;
                }

                let sourceInfo = '';
                if (record.impurity_source) {
                    sourceInfo = `\n杂质来源分析:\n- 主要来源: ${record.impurity_source.primary_source}\n- 严重程度: ${record.impurity_source.severity}\n- 建议: ${record.impurity_source.recommendations.join('; ')}`;
                }

                alert(`
记录ID: ${record.id}
文件名: ${record.filename}
批次ID: ${record.batch_id || '无'}

纤维配比:
${ratioHtml}
强度: ${record.strength}
质量等级: ${record.strength_level} - ${LEVEL_NAMES[record.strength_level]}
杂质数: ${record.impurity_count}
${sourceInfo}
分析时间: ${new Date(record.created_at).toLocaleString()}
                `);
            } catch (error) {
                alert('获取详情失败: ' + error.message);
            }
        }

        async function deleteRecord(id) {
            if (!confirm('确定要删除这条记录吗？')) return;

            try {
                const response = await fetch(`${API_BASE}/api/history/${id}`, { method: 'DELETE' });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '删除失败');
                }
                loadHistory();
            } catch (error) {
                alert('删除失败: ' + error.message);
            }
        }

        function traceImpurityById(id) {
            document.getElementById('traceRecordId').value = id;
            switchTab('trace');
            traceImpurity();
        }

        async function traceImpurity() {
            const recordId = document.getElementById('traceRecordId').value;
            if (!recordId) {
                document.getElementById('traceError').innerHTML = `
                    <div class="alert alert-error">请输入记录ID</div>
                `;
                return;
            }

            document.getElementById('traceLoading').classList.add('show');
            document.getElementById('traceResult').innerHTML = '';
            document.getElementById('traceError').innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/api/impurity/trace/${recordId}`);
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP ${response.status}`);
                }

                const result = await response.json();
                displayTraceResult(result);
            } catch (error) {
                document.getElementById('traceError').innerHTML = `
                    <div class="alert alert-error">
                        <strong>溯源失败:</strong> ${error.message}
                    </div>
                `;
            } finally {
                document.getElementById('traceLoading').classList.remove('show');
            }
        }

        function displayTraceResult(result) {
            const resultDiv = document.getElementById('traceResult');

            if (!result.has_impurity) {
                resultDiv.innerHTML = `
                    <div class="alert alert-info">
                        <strong>${result.message}</strong>
                    </div>
                `;
                return;
            }

            const source = result.impurity_source;
            const severityClass = source.severity === '优秀' ? 'level-A' :
                                   source.severity === '良好' ? 'level-B' :
                                   source.severity === '中等' ? 'level-C' : 'level-E';

            let relatedHtml = '';
            if (result.related_records && result.related_records.length > 0) {
                relatedHtml = `
                    <h4 style="margin: 15px 0 10px;">同批次同来源污染记录</h4>
                    <p>批次内共 ${result.same_batch_count} 条记录发现相同来源杂质</p>
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>记录ID</th>
                                <th>文件名</th>
                                <th>杂质数量</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${result.related_records.map(r => `
                                <tr>
                                    <td>${r.id}</td>
                                    <td>${r.filename}</td>
                                    <td>${r.impurity_count}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }

            resultDiv.innerHTML = `
                <div class="result-card">
                    <h3 style="margin-bottom: 15px;">✅ 杂质溯源分析完成</h3>

                    <div class="result-item">
                        <span>主要污染来源</span>
                        <strong>${source.primary_source}</strong>
                    </div>
                    <div class="result-item">
                        <span>污染严重程度</span>
                        <span class="severity-badge ${severityClass}">${source.severity}</span>
                    </div>

                    <h4 style="margin: 15px 0 10px;">改善建议</h4>
                    <ul class="recommendation-list">
                        ${source.recommendations.map(r => `<li>${r}</li>`).join('')}
                    </ul>

                    ${relatedHtml}
                </div>
            `;
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const stats = await response.json();

                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_analysis}</div>
                        <div class="stat-label">总分析次数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.average_strength}</div>
                        <div class="stat-label">平均强度</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.max_strength}</div>
                        <div class="stat-label">最高强度</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.min_strength}</div>
                        <div class="stat-label">最低强度</div>
                    </div>
                `;

                const dist = stats.strength_level_distribution || {};
                let distHtml = '<div class="result-card"><h4 style="margin-bottom: 15px;">质量等级分布</h4>';
                for (const [level, count] of Object.entries(dist)) {
                    const percentage = ((count / stats.total_analysis) * 100).toFixed(1);
                    distHtml += `
                        <div class="result-item">
                            <span><span class="impurity-tag level-${level}">${level} - ${LEVEL_NAMES[level]}</span></span>
                            <span>${count} 次 (${percentage}%)</span>
                        </div>
                        <div class="ratio-bar" style="width: ${percentage}%"></div>
                    `;
                }
                distHtml += '</div>';
                document.getElementById('levelDistribution').innerHTML = distHtml;

            } catch (error) {
                console.error('加载统计数据失败:', error);
                document.getElementById('statsGrid').innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: #999;">
                        加载统计数据失败
                    </div>
                `;
            }
        }

        async function loadModelConfig() {
            try {
                const response = await fetch(`${API_BASE}/api/model/config`);
                const config = await response.json();

                document.getElementById('currentConfig').innerHTML = `
                    <div class="result-card">
                        <h4 style="margin-bottom: 10px;">强度阈值配置</h4>
                        <pre style="background: #f8f9fa; padding: 10px; border-radius: 6px; overflow-x: auto;">
${JSON.stringify(config.strength_thresholds, null, 2)}</pre>
                        <h4 style="margin: 15px 0 10px;">纤维颜色范围</h4>
                        <pre style="background: #f8f9fa; padding: 10px; border-radius: 6px; overflow-x: auto;">
${JSON.stringify(config.fiber_colors_hsv, null, 2)}</pre>
                        <h4 style="margin: 15px 0 10px;">杂质分类器</h4>
                        <pre style="background: #f8f9fa; padding: 10px; border-radius: 6px; overflow-x: auto;">
${JSON.stringify(config.impurity_classifier, null, 2)}</pre>
                    </div>
                `;

                loadModelVersions();
            } catch (error) {
                console.error('加载配置失败:', error);
            }
        }

        async function loadModelVersions() {
            try {
                const response = await fetch(`${API_BASE}/api/model/versions`);
                const versions = await response.json();

                const tbody = document.getElementById('versionTableBody');
                if (versions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">暂无版本记录</td></tr>';
                    return;
                }

                tbody.innerHTML = versions.map(v => `
                    <tr>
                        <td>${v.id}</td>
                        <td>${v.version}</td>
                        <td>${v.is_active ? '<span class="impurity-tag level-A">当前生效</span>' : '未激活'}</td>
                        <td>${v.description || '-'}</td>
                        <td>${new Date(v.created_at).toLocaleString()}</td>
                        <td>${!v.is_active ? `<button onclick="activateModel(${v.id})" class="btn-success" style="padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; color: white;">激活</button>` : '-'}</td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('加载版本列表失败:', error);
            }
        }

        async function activateModel(configId) {
            if (!confirm('确定要激活此版本配置吗？激活后新的分析将使用新配置。')) return;

            try {
                const response = await fetch(`${API_BASE}/api/model/activate/${configId}`, { method: 'POST' });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '激活失败');
                }
                const result = await response.json();
                alert(`✅ ${result.message}`);
                loadModelVersions();
                loadModelConfig();
            } catch (error) {
                alert('激活失败: ' + error.message);
            }
        }

        function fillDefaultConfig() {
            const defaultThresholds = {
                "A": {"min": 5.5, "name": "特级"},
                "B": {"min": 4.5, "name": "一级"},
                "C": {"min": 3.5, "name": "二级"},
                "D": {"min": 2.5, "name": "三级"},
                "E": {"min": 0, "name": "不合格"}
            };
            const defaultColors = {
                "cotton": {"lower": [0, 0, 180], "upper": [180, 30, 255]},
                "polyester": {"lower": [100, 20, 100], "upper": [140, 80, 200]},
                "wool": {"lower": [10, 10, 100], "upper": [30, 60, 180]},
                "silk": {"lower": [20, 5, 200], "upper": [40, 30, 255]}
            };
            const defaultClassifier = {
                "particle": {"sources": ["粉尘", "空气中污染物"]},
                "fiber_debris": {"sources": ["机器磨损", "原料残渣"]},
                "large_contaminant": {"sources": ["包装材料", "外部杂物"]},
                "metal_shard": {"sources": ["设备零件", "工具磨损"]},
                "stain": {"sources": ["水渍", "油渍", "染料残留"]}
            };

            document.getElementById('strengthThresholds').value = JSON.stringify(defaultThresholds, null, 2);
            document.getElementById('fiberColorRanges').value = JSON.stringify(defaultColors, null, 2);
            document.getElementById('impurityClassifier').value = JSON.stringify(defaultClassifier, null, 2);
        }

        async function saveNewConfig() {
            const version = document.getElementById('newVersion').value.trim();
            const description = document.getElementById('versionDesc').value.trim();
            const thresholdsStr = document.getElementById('strengthThresholds').value.trim();
            const colorsStr = document.getElementById('fiberColorRanges').value.trim();
            const classifierStr = document.getElementById('impurityClassifier').value.trim();

            if (!version) {
                alert('请输入版本号');
                return;
            }

            try {
                const data = { version, description };
                if (thresholdsStr) data.strength_thresholds = JSON.parse(thresholdsStr);
                if (colorsStr) data.fiber_color_ranges = JSON.parse(colorsStr);
                if (classifierStr) data.impurity_classifier = JSON.parse(classifierStr);

                const response = await fetch(`${API_BASE}/api/model/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '保存失败');
                }

                const result = await response.json();
                alert(`✅ ${result.message}\n${result.note}`);
                loadModelVersions();
            } catch (error) {
                if (error.message.includes('JSON')) {
                    alert('JSON格式错误，请检查输入');
                } else {
                    alert('保存失败: ' + error.message);
                }
            }
        }

        function getFiberName(key) {
            const names = {
                cotton: '棉纤维',
                polyester: '聚酯纤维',
                wool: '羊毛',
                silk: '蚕丝',
                other: '其他纤维'
            };
            return names[key] || key;
        }
    </script>
</body>
</html>
