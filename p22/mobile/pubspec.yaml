name: fit_track_mobile
description: AI-powered fitness tracking mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  camera: ^0.10.5
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  provider: ^6.1.1
  json_annotation: ^4.8.1
  flutter_tts: ^3.8.5
  permission_handler: ^11.0.1
  video_player: ^2.8.1
  dio: ^5.4.0
  path_provider: ^2.1.1
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
