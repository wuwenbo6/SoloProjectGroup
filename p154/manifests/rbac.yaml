apiVersion: v1
kind: ServiceAccount
metadata:
  name: netpol-ebpf
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netpol-ebpf
rules:
- apiGroups: ["netpol.ebpf.cni"]
  resources: ["l7networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netpol-ebpf
subjects:
- kind: ServiceAccount
  name: netpol-ebpf
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: netpol-ebpf
  apiGroup: rbac.authorization.k8s.io
