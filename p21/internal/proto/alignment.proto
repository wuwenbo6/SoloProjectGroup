syntax = "proto3";

package alignment;

option go_package = "github.com/genomics/alignment/internal/proto";

service AlignmentService {
  rpc UploadFasta(stream UploadRequest) returns (UploadResponse);
  rpc GetTaskStatus(StatusRequest) returns (StatusResponse);
  rpc DownloadResult(DownloadRequest) returns (DownloadResponse);
}

message UploadRequest {
  string file_name = 1;
  bytes chunk_data = 2;
  int64 chunk_index = 3;
  bool is_first_chunk = 4;
}

message UploadResponse {
  string task_id = 1;
  bool success = 2;
  string message = 3;
}

message StatusRequest {
  string task_id = 1;
}

message StatusResponse {
  string task_id = 1;
  TaskStatus status = 2;
  int32 total_chunks = 3;
  int32 completed_chunks = 4;
  int32 progress = 5;
  string message = 6;
}

message DownloadRequest {
  string task_id = 1;
}

message DownloadResponse {
  string task_id = 1;
  bool success = 2;
  bytes result_data = 3;
  string message = 4;
}

enum TaskStatus {
  UNKNOWN = 0;
  PENDING = 1;
  UPLOADING = 2;
  PROCESSING = 3;
  MERGING = 4;
  COMPLETED = 5;
  FAILED = 6;
}
