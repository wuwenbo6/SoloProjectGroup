spring:
  application:
    name: indexer
  datasource:
    url: jdbc:h2:mem:indexer;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8081

indexer:
  poll-interval: 3000
  start-block: 0
  mock-mode: true
  redis:
    last-processed-block-key: indexer:last_processed_block
    mock-block-number-key: indexer:mock_block_number

mock:
  chain:
    url: http://localhost:8082