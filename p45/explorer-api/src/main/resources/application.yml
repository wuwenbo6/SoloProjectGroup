spring:
  application:
    name: explorer-api
  datasource:
    url: jdbc:h2:mem:explorer;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080
  servlet:
    context-path: /api

web3j:
  client-address: http://localhost:8545

orgs:
  count: 3
  names:
    - Org1
    - Org2
    - Org3