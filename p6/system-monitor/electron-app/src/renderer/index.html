<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统资源监控</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      font-size: 24px;
    }
    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select, input, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a4e;
      color: #eee;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background: #4a6fa5;
      border: none;
      transition: background 0.2s;
    }
    button:hover {
      background: #5a7fb5;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }
    .metric-card {
      background: linear-gradient(135deg, #2a2a4e 0%, #1a1a2e 100%);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #333;
    }
    .metric-title {
      font-size: 14px;
      color: #888;
      margin-bottom: 8px;
    }
    .metric-value {
      font-size: 28px;
      font-weight: bold;
    }
    .metric-bar {
      height: 6px;
      background: #333;
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    .metric-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s;
    }
    .charts-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }
    .chart-card {
      background: #2a2a4e;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #333;
    }
    .chart-title {
      font-size: 16px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }
    .process-list {
      background: #2a2a4e;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #333;
    }
    .process-header {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      padding: 10px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }
    .process-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      padding: 10px;
      border-bottom: 1px solid #222;
    }
    .process-row:hover {
      background: rgba(255,255,255,0.05);
    }
    .export-section {
      margin-top: 20px;
      padding: 20px;
      background: #2a2a4e;
      border-radius: 12px;
      border: 1px solid #333;
    }
    .date-inputs {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
    }
    .alert-badge {
      background: #ef4444;
      color: white;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 12px;
      margin-left: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid #333;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #333;
    }
    .close-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
    }
    .detail-row {
      display: flex;
      padding: 12px 0;
      border-bottom: 1px solid #222;
    }
    .detail-label {
      width: 120px;
      color: #888;
      flex-shrink: 0;
    }
    .detail-value {
      color: #eee;
      flex: 1;
      word-break: break-all;
    }
    .action-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      margin-right: 8px;
    }
    .action-btn.danger {
      background: #ef4444;
      color: white;
    }
    .action-btn.primary {
      background: #4a6fa5;
      color: white;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .alert-item {
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border-left: 3px solid #ef4444;
      margin-bottom: 8px;
      border-radius: 4px;
    }
    .alert-time {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .config-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #222;
    }
    .config-input {
      width: 80px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a4e;
      color: #eee;
    }
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #444;
      transition: .4s;
      border-radius: 24px;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .toggle-slider {
      background-color: #4ade80;
    }
    input:checked + .toggle-slider:before {
      transform: translateX(24px);
    }
    h4 {
      color: #ccc;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/recharts@2.10.0/umd/Recharts.js"></script>
  <script src="components/CpuChart.js"></script>
  <script src="components/MemoryChart.js"></script>
  <script src="App.js"></script>
</body>
</html>
