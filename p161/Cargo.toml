[package]
name = "rinex2nmea"
version = "0.1.0"
edition = "2021"
description = "RINEX to NMEA converter with GPS satellite simulation and positioning"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
nalgebra = "0.32"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
quick-xml = { version = "0.31", features = ["serialize"] }
flate2 = "1.0"

[[bin]]
name = "rinex2nmea"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
