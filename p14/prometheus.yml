# Prometheus监控配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "rules.yml"

scrape_configs:
  # 监控Prometheus自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 监控主应用
  - job_name: 'analytics-app'
    static_configs:
      - targets: ['app:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # 监控PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # 监控Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # 监控Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  # 监控Zookeeper
  - job_name: 'zookeeper'
    static_configs:
      - targets: ['zookeeper:2181']
