# 敏感信息Secrets (生产环境请使用Sealed Secrets或Vault)
apiVersion: v1
kind: Secret
metadata:
  name: analytics-secrets
  namespace: analytics-platform
type: Opaque
data:
  # 注意: 生产环境请替换为真实的Base64编码值
  # 使用: echo -n "your-password" | base64
  POSTGRES_PASSWORD: cG9zdGdyZXMxMjM=  # postgres123
  DATABASE_PASSWORD: cG9zdGdyZXMxMjM=  # postgres123
  JWT_SECRET: c2VjcmV0X2tleV8xMjM0NTY3ODk=  # secret_key_123456789
  REDIS_PASSWORD: ""  # 如果Redis需要密码
---
# 邮件通知配置
apiVersion: v1
kind: Secret
metadata:
  name: email-secrets
  namespace: analytics-platform
type: Opaque
data:
  SMTP_HOST: c210cC5leGFtcGxlLmNvbQ==  # smtp.example.com
  SMTP_PORT: NTg3  # 587
  SMTP_USER: bm90aWZ5QGV4YW1wbGUuY29t  # notify@example.com
  SMTP_PASSWORD: eW91ci1zbXRwLXBhc3N3b3Jk  # your-smtp-password
  ALERT_RECIPIENTS: YWRtaW5AZXhhbXBsZS5jb20=  # admin@example.com
