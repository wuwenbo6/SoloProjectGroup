server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    connection-timeout: 10000
    max-connections: 200
    threads:
      max: 100
      min-spare: 10

spring:
  mvc:
    async:
      request-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  datasource:
    furniture:
      jdbc-url: jdbc:mysql://localhost:3306/mortise_furniture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      validation-timeout: 5000
      leak-detection-threshold: 60000
    teaching:
      jdbc-url: jdbc:mysql://localhost:3306/mortise_teaching?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      validation-timeout: 5000
      leak-detection-threshold: 60000
    user:
      jdbc-url: jdbc:mysql://localhost:3306/mortise_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 10MB

app:
  upload:
    path: uploads

jwt:
  secret: mortisejoiner2024secretkey1234567890
  expiration: 86400000

logging:
  level:
    com.mortisejoiner: INFO
    org.springframework.security: WARN
    com.zaxxer.hikari: WARN
