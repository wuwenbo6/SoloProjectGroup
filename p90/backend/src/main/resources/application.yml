server:
  port: 8080

spring:
  application:
    name: pattern-platform

  datasource:
    pattern:
      jdbc-url: jdbc:h2:mem:pattern_db;DB_CLOSE_DELAY=-1
      driver-class-name: org.h2.Driver
      username: sa
      password:
    user:
      jdbc-url: jdbc:h2:mem:user_db;DB_CLOSE_DELAY=-1
      driver-class-name: org.h2.Driver
      username: sa
      password:
    interaction:
      jdbc-url: jdbc:h2:mem:interaction_db;DB_CLOSE_DELAY=-1
      driver-class-name: org.h2.Driver
      username: sa
      password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.pattern: DEBUG
