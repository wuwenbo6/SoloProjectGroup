<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谜题编辑器 - 协作解谜游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, #4ECDC4, #45B7D1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .editor-layout {
      display: grid;
      grid-template-columns: 300px 1fr 350px;
      gap: 20px;
      min-height: 70vh;
    }

    .panel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
    }

    .panel-title {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #4ECDC4;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .puzzle-types {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .puzzle-type-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s;
      color: #fff;
    }

    .puzzle-type-btn:hover,
    .puzzle-type-btn.active {
      border-color: #4ECDC4;
      background: rgba(78, 205, 196, 0.2);
    }

    .puzzle-type-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .puzzle-type-name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .puzzle-type-desc {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .canvas-area {
      display: flex;
      flex-direction: column;
    }

    .puzzle-name-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .puzzle-name-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .canvas-container {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      min-height: 500px;
    }

    .canvas-drop-area {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 500px;
    }

    .drop-hint {
      text-align: center;
      opacity: 0.5;
    }

    .drop-hint-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .config-section {
      margin-bottom: 20px;
    }

    .config-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .config-input,
    .config-select,
    .config-textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
    }

    .config-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-label input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(90deg, #4ECDC4, #45B7D1);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .saved-puzzles-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .saved-puzzle-item {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .saved-puzzle-name {
      font-weight: 500;
    }

    .saved-puzzle-type {
      font-size: 0.8rem;
      opacity: 0.7;
    }

    .saved-puzzle-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.3s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .puzzle-preview {
      padding: 20px;
      width: 100%;
    }

    .password-config {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .password-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .password-digit {
      width: 60px;
      height: 80px;
      background: rgba(78, 205, 196, 0.2);
      border: 2px solid #4ECDC4;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      color: #4ECDC4;
    }

    .puzzle-grid-config {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .grid-cell {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1.5rem;
    }

    .grid-cell:hover {
      border-color: #4ECDC4;
      background: rgba(78, 205, 196, 0.2);
    }

    .hidden-objects-config {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .object-item {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .object-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 8px;
      color: #fff;
    }

    .add-btn {
      background: #4ECDC4;
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .remove-btn {
      background: #FF6B6B;
      border: none;
      border-radius: 6px;
      color: #fff;
      width: 30px;
      height: 30px;
      cursor: pointer;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 16px 24px;
      border-radius: 8px;
      color: #fff;
      font-weight: 500;
      z-index: 1000;
      animation: slideIn 0.3s ease-out;
    }

    .notification.success {
      background: linear-gradient(90deg, #4ECDC4, #45B7D1);
    }

    .notification.error {
      background: linear-gradient(90deg, #FF6B6B, #FF8E8E);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .creator-info {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧩 谜题编辑器</h1>
      <a href="/" class="nav-btn">← 返回游戏</a>
    </header>

    <div class="creator-info">
      <input type="text" id="creatorName" class="puzzle-name-input" placeholder="你的名字" style="width: 200px; margin-bottom: 0;">
      <input type="text" id="creatorId" class="puzzle-name-input" placeholder="创作者ID（可选）" style="width: 200px; margin-bottom: 0;">
    </div>

    <div class="editor-layout">
      <div class="panel">
        <div class="panel-title">谜题类型</div>
        <div class="puzzle-types">
          <div class="puzzle-type-btn active" data-type="password">
            <div class="puzzle-type-icon">🔐</div>
            <div class="puzzle-type-name">密码锁</div>
            <div class="puzzle-type-desc">数字密码解谜</div>
          </div>
          <div class="puzzle-type-btn" data-type="jigsaw">
            <div class="puzzle-type-icon">🧩</div>
            <div class="puzzle-type-name">拼图</div>
            <div class="puzzle-type-desc">可配置网格拼图</div>
          </div>
          <div class="puzzle-type-btn" data-type="hidden">
            <div class="puzzle-type-icon">🔍</div>
            <div class="puzzle-type-name">隐藏物体</div>
            <div class="puzzle-type-desc">寻找隐藏物品</div>
          </div>
        </div>

        <div class="panel-title" style="margin-top: 30px;">我的谜题</div>
        <div class="saved-puzzles-list" id="savedPuzzles">
          <div style="opacity: 0.5; font-size: 0.9rem;">暂无保存的谜题</div>
        </div>
      </div>

      <div class="panel canvas-area">
        <input type="text" id="puzzleName" class="puzzle-name-input" placeholder="输入谜题名称...">
        
        <div class="canvas-container">
          <div class="canvas-drop-area" id="puzzlePreview">
            <div class="drop-hint">
              <div class="drop-hint-icon">🎯</div>
              <p>从左侧选择谜题类型开始创建</p>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">配置</div>
        
        <div id="configPanel">
          <div class="config-section">
            <label class="config-label">密码长度</label>
            <select class="config-select" id="passwordLength">
              <option value="3">3 位</option>
              <option value="4" selected>4 位</option>
              <option value="5">5 位</option>
              <option value="6">6 位</option>
            </select>
          </div>
          
          <div class="config-section">
            <label class="config-label">预设密码</label>
            <input type="text" class="config-input" id="passwordValue" placeholder="留空则随机生成" maxlength="6">
          </div>

          <div class="config-section">
            <label class="config-label">提示（可选）</label>
            <textarea class="config-textarea" id="puzzleHint" placeholder="输入解谜提示..."></textarea>
          </div>
        </div>

        <div class="config-section">
          <label class="checkbox-label">
            <input type="checkbox" id="isPublic">
            <span>公开分享此谜题</span>
          </label>
        </div>

        <div class="actions">
          <button class="btn btn-secondary" onclick="clearPuzzle()">清空</button>
          <button class="btn btn-primary" onclick="savePuzzle()">保存谜题</button>
        </div>
      </div>
    </div>
  </div>

  <div id="notification" class="notification" style="display: none;"></div>

  <script>
    let currentPuzzleType = 'password';
    let currentEditingId = null;

    const puzzleTypeButtons = document.querySelectorAll('.puzzle-type-btn');
    puzzleTypeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        puzzleTypeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPuzzleType = btn.dataset.type;
        updateConfigPanel();
        updatePreview();
      });
    });

    function updateConfigPanel() {
      const configPanel = document.getElementById('configPanel');
      
      switch (currentPuzzleType) {
        case 'password':
          configPanel.innerHTML = `
            <div class="config-section">
              <label class="config-label">密码长度</label>
              <select class="config-select" id="passwordLength" onchange="updatePreview()">
                <option value="3">3 位</option>
                <option value="4" selected>4 位</option>
                <option value="5">5 位</option>
                <option value="6">6 位</option>
              </select>
            </div>
            
            <div class="config-section">
              <label class="config-label">预设密码</label>
              <input type="text" class="config-input" id="passwordValue" placeholder="留空则随机生成" maxlength="6" oninput="updatePreview()">
            </div>

            <div class="config-section">
              <label class="config-label">提示（可选）</label>
              <textarea class="config-textarea" id="puzzleHint" placeholder="输入解谜提示..."></textarea>
            </div>

            <div class="config-section">
              <label class="config-label">最大尝试次数</label>
              <input type="number" class="config-input" id="maxAttempts" value="10" min="1">
            </div>
          `;
          break;
          
        case 'jigsaw':
          configPanel.innerHTML = `
            <div class="config-section">
              <label class="config-label">网格大小</label>
              <select class="config-select" id="gridSize" onchange="updatePreview()">
                <option value="2">2 x 2</option>
                <option value="3" selected>3 x 3</option>
                <option value="4">4 x 4</option>
              </select>
            </div>

            <div class="config-section">
              <label class="config-label">图片URL（可选）</label>
              <input type="text" class="config-input" id="imageUrl" placeholder="输入图片链接">
            </div>

            <div class="config-section">
              <label class="config-label">提示（可选）</label>
              <textarea class="config-textarea" id="puzzleHint" placeholder="输入解谜提示..."></textarea>
            </div>
          `;
          break;
          
        case 'hidden':
          configPanel.innerHTML = `
            <div class="config-section">
              <label class="config-label">隐藏物体</label>
              <div class="hidden-objects-config" id="objectsList">
                <div class="object-item">
                  <input type="text" class="object-input" placeholder="物体名称" value="🔑 钥匙">
                  <input type="number" class="object-input" placeholder="X位置" value="150" style="width: 80px;">
                  <input type="number" class="object-input" placeholder="Y位置" value="200" style="width: 80px;">
                  <button class="remove-btn" onclick="removeObject(this)">×</button>
                </div>
              </div>
              <button class="add-btn" style="margin-top: 10px;" onclick="addObject()">+ 添加物体</button>
            </div>

            <div class="config-section">
              <label class="config-label">场景背景色</label>
              <input type="color" class="config-input" id="sceneColor" value="#2d3436">
            </div>

            <div class="config-section">
              <label class="config-label">提示（可选）</label>
              <textarea class="config-textarea" id="puzzleHint" placeholder="输入解谜提示..."></textarea>
            </div>
          `;
          break;
      }
    }

    function updatePreview() {
      const preview = document.getElementById('puzzlePreview');
      const puzzleName = document.getElementById('puzzleName').value || '未命名谜题';
      
      switch (currentPuzzleType) {
        case 'password':
          const length = parseInt(document.getElementById('passwordLength')?.value || 4);
          const password = document.getElementById('passwordValue')?.value || generateRandomPassword(length);
          preview.innerHTML = `
            <div class="puzzle-preview password-config">
              <h3 style="text-align: center; margin-bottom: 20px;">🔐 ${puzzleName}</h3>
              <div class="password-display">
                ${Array(length).fill(0).map((_, i) => `<div class="password-digit">${password[i] || '*'}</div>`).join('')}
              </div>
              <p style="text-align: center; opacity: 0.7;">密码: ${password}</p>
            </div>
          `;
          break;
          
        case 'jigsaw':
          const size = parseInt(document.getElementById('gridSize')?.value || 3);
          preview.innerHTML = `
            <div class="puzzle-preview">
              <h3 style="text-align: center; margin-bottom: 20px;">🧩 ${puzzleName}</h3>
              <div class="puzzle-grid-config" style="grid-template-columns: repeat(${size}, 1fr); max-width: 300px; margin: 0 auto;">
                ${Array(size * size).fill(0).map((_, i) => `<div class="grid-cell">${i + 1}</div>`).join('')}
              </div>
              <p style="text-align: center; margin-top: 20px; opacity: 0.7;">${size} x ${size} 拼图</p>
            </div>
          `;
          break;
          
        case 'hidden':
          const sceneColor = document.getElementById('sceneColor')?.value || '#2d3436';
          const objects = document.querySelectorAll('.object-item');
          let objectCount = 0;
          objects.forEach(obj => {
            const name = obj.querySelector('.object-input')?.value;
            if (name) objectCount++;
          });
          
          preview.innerHTML = `
            <div class="puzzle-preview">
              <h3 style="text-align: center; margin-bottom: 20px;">🔍 ${puzzleName}</h3>
              <div style="background: ${sceneColor}; padding: 40px; border-radius: 12px; text-align: center;">
                <div style="font-size: 3rem; margin-bottom: 20px;">🏠</div>
                <p>场景预览</p>
              </div>
              <p style="text-align: center; margin-top: 20px; opacity: 0.7;">${objectCount} 个隐藏物体</p>
            </div>
          `;
          break;
      }
    }

    function generateRandomPassword(length) {
      let result = '';
      for (let i = 0; i < length; i++) {
        result += Math.floor(Math.random() * 10);
      }
      return result;
    }

    function addObject() {
      const list = document.getElementById('objectsList');
      const div = document.createElement('div');
      div.className = 'object-item';
      div.innerHTML = `
        <input type="text" class="object-input" placeholder="物体名称">
        <input type="number" class="object-input" placeholder="X" value="${100 + Math.random() * 300}" style="width: 80px;">
        <input type="number" class="object-input" placeholder="Y" value="${100 + Math.random() * 300}" style="width: 80px;">
        <button class="remove-btn" onclick="removeObject(this)">×</button>
      `;
      list.appendChild(div);
      updatePreview();
    }

    function removeObject(btn) {
      btn.parentElement.remove();
      updatePreview();
    }

    function clearPuzzle() {
      document.getElementById('puzzleName').value = '';
      currentEditingId = null;
      updateConfigPanel();
      updatePreview();
      showNotification('已清空', 'success');
    }

    function getPuzzleConfig() {
      switch (currentPuzzleType) {
        case 'password':
          const length = parseInt(document.getElementById('passwordLength')?.value || 4);
          const password = document.getElementById('passwordValue')?.value || generateRandomPassword(length);
          return {
            length,
            password,
            hint: document.getElementById('puzzleHint')?.value || '',
            maxAttempts: parseInt(document.getElementById('maxAttempts')?.value || 10)
          };
          
        case 'jigsaw':
          return {
            gridSize: parseInt(document.getElementById('gridSize')?.value || 3),
            imageUrl: document.getElementById('imageUrl')?.value || '',
            hint: document.getElementById('puzzleHint')?.value || ''
          };
          
        case 'hidden':
          const objects = [];
          document.querySelectorAll('.object-item').forEach(item => {
            const inputs = item.querySelectorAll('.object-input');
            if (inputs[0]?.value) {
              objects.push({
                name: inputs[0].value,
                x: parseFloat(inputs[1]?.value || 0),
                y: parseFloat(inputs[2]?.value || 0)
              });
            }
          });
          return {
            objects,
            sceneColor: document.getElementById('sceneColor')?.value || '#2d3436',
            hint: document.getElementById('puzzleHint')?.value || ''
          };
      }
    }

    async function savePuzzle() {
      const name = document.getElementById('puzzleName').value.trim();
      if (!name) {
        showNotification('请输入谜题名称', 'error');
        return;
      }

      const creatorName = document.getElementById('creatorName').value.trim() || '匿名创作者';
      const creatorId = document.getElementById('creatorId').value.trim() || 'guest_' + Date.now();
      const isPublic = document.getElementById('isPublic').checked;
      const config = getPuzzleConfig();

      try {
        const url = currentEditingId ? `/api/puzzles/${currentEditingId}` : '/api/puzzles';
        const method = currentEditingId ? 'PUT' : 'POST';
        
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            creatorId,
            creatorName,
            name,
            puzzleType: currentPuzzleType,
            config,
            isPublic
          })
        });

        const result = await response.json();
        if (result.success) {
          currentEditingId = result.puzzleId || currentEditingId;
          showNotification('谜题保存成功！', 'success');
          loadSavedPuzzles();
        } else {
          showNotification('保存失败: ' + result.error, 'error');
        }
      } catch (error) {
        showNotification('保存失败: ' + error.message, 'error');
      }
    }

    async function loadSavedPuzzles() {
      const creatorId = document.getElementById('creatorId').value.trim();
      if (!creatorId) return;

      try {
        const response = await fetch(`/api/puzzles?creatorId=${creatorId}`);
        const puzzles = await response.json();
        
        const list = document.getElementById('savedPuzzles');
        if (puzzles.length === 0) {
          list.innerHTML = '<div style="opacity: 0.5; font-size: 0.9rem;">暂无保存的谜题</div>';
          return;
        }

        list.innerHTML = puzzles.map(puzzle => `
          <div class="saved-puzzle-item">
            <div>
              <div class="saved-puzzle-name">${puzzle.name}</div>
              <div class="saved-puzzle-type">${getPuzzleTypeName(puzzle.puzzle_type)}</div>
            </div>
            <div class="saved-puzzle-actions">
              <button class="icon-btn" onclick="editPuzzle('${puzzle.id}')" title="编辑">✏️</button>
              <button class="icon-btn" onclick="deletePuzzle('${puzzle.id}')" title="删除">🗑️</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Failed to load puzzles:', error);
      }
    }

    function getPuzzleTypeName(type) {
      const names = { password: '密码锁', jigsaw: '拼图', hidden: '隐藏物体' };
      return names[type] || type;
    }

    async function editPuzzle(puzzleId) {
      try {
        const response = await fetch(`/api/puzzles/${puzzleId}`);
        const puzzle = await response.json();
        
        currentEditingId = puzzleId;
        document.getElementById('puzzleName').value = puzzle.name;
        document.getElementById('isPublic').checked = puzzle.is_public;
        
        currentPuzzleType = puzzle.puzzle_type;
        puzzleTypeButtons.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.type === puzzle.puzzle_type);
        });
        
        updateConfigPanel();
        
        if (puzzle.config) {
          if (puzzle.puzzle_type === 'password') {
            if (document.getElementById('passwordLength')) document.getElementById('passwordLength').value = puzzle.config.length || 4;
            if (document.getElementById('passwordValue')) document.getElementById('passwordValue').value = puzzle.config.password || '';
            if (document.getElementById('puzzleHint')) document.getElementById('puzzleHint').value = puzzle.config.hint || '';
            if (document.getElementById('maxAttempts')) document.getElementById('maxAttempts').value = puzzle.config.maxAttempts || 10;
          }
        }
        
        updatePreview();
        showNotification('已加载谜题', 'success');
      } catch (error) {
        showNotification('加载失败: ' + error.message, 'error');
      }
    }

    async function deletePuzzle(puzzleId) {
      if (!confirm('确定要删除这个谜题吗？')) return;
      
      const creatorId = document.getElementById('creatorId').value.trim();
      try {
        const response = await fetch(`/api/puzzles/${puzzleId}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ creatorId })
        });
        
        const result = await response.json();
        if (result.success) {
          if (currentEditingId === puzzleId) {
            clearPuzzle();
          }
          showNotification('删除成功', 'success');
          loadSavedPuzzles();
        } else {
          showNotification('删除失败: ' + result.error, 'error');
        }
      } catch (error) {
        showNotification('删除失败: ' + error.message, 'error');
      }
    }

    function showNotification(message, type = 'success') {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.className = `notification ${type}`;
      notification.style.display = 'block';
      
      setTimeout(() => {
        notification.style.display = 'none';
      }, 3000);
    }

    document.getElementById('creatorId').addEventListener('input', loadSavedPuzzles);
    
    updateConfigPanel();
    updatePreview();
  </script>
</body>
</html>
