server:
  port: 8080
  netty:
    connection-timeout: 30000
    idle-timeout: 60000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      httpclient:
        connect-timeout: 30000
        response-timeout: 60s
        pool:
          max-connections: 100
          max-idle-time: 30s
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: image-parser-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/image/**
          filters:
            - name: CircuitBreaker
              args:
                name: imageServiceCircuitBreaker
                fallbackUri: forward:/fallback/image
        - id: text-segmentation-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/text/**
          filters:
            - name: CircuitBreaker
              args:
                name: textServiceCircuitBreaker
                fallbackUri: forward:/fallback/text
        - id: semantic-matching-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/semantic/**
          filters:
            - name: CircuitBreaker
              args:
                name: semanticServiceCircuitBreaker
                fallbackUri: forward:/fallback/semantic
        - id: database-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/database/**
          filters:
            - name: CircuitBreaker
              args:
                name: databaseServiceCircuitBreaker
                fallbackUri: forward:/fallback/database
        - id: ai-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/ai/**
          filters:
            - name: CircuitBreaker
              args:
                name: aiServiceCircuitBreaker
                fallbackUri: forward:/fallback/ai
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      imageServiceCircuitBreaker:
        base-config: default
      textServiceCircuitBreaker:
        base-config: default
      semanticServiceCircuitBreaker:
        base-config: default
      databaseServiceCircuitBreaker:
        base-config: default
      aiServiceCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 60s
        cancel-running-future: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    reactor.netty: INFO
    com.ancient.book.gateway: DEBUG
