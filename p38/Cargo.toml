[package]
name = "ancient-book-transcriber"
version = "0.1.0"
edition = "2021"
description = "古籍刻本数字化转录命令行工具"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
image = { version = "0.24", features = ["png", "jpeg"] }
opencv = { version = "0.88", optional = true }
tch = { version = "0.14", optional = true }
rusqlite = { version = "0.29", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
printpdf = "0.6"
anyhow = "1.0"
thiserror = "1.0"
git2 = "0.18"
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
dirs = "5.0"
chrono = "0.4"
log = "0.4"
env_logger = "0.10"
rand = "0.8"
csv = "1.2"
num_cpus = "1.15"
parking_lot = "0.12"
walkdir = "2.4"

[features]
default = ["opencv"]
full = ["opencv", "tch"]
cuda = ["tch/cuda"]

[[bin]]
name = "abt"
path = "src/main.rs"
