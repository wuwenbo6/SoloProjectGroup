<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload & Alignment - Gene Sequence Alignment System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>🧬 Gene Sequence Alignment System</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/upload">Upload Sequences</a>
            <a href="/results">Alignment Results</a>
            <a href="/docs" target="_blank">API Docs</a>
        </nav>
    </header>

    <main>
        <div class="two-column">
            <section class="upload-section">
                <h2>📁 Upload to Sequence Database</h2>
                <div class="form-group">
                    <label>Upload FASTA File</label>
                    <input type="file" id="fasta-upload" accept=".fasta,.fa,.fna">
                </div>
                <button class="btn btn-primary" onclick="uploadSequences()">Upload to Database</button>
                <div id="upload-result" class="result-box"></div>
            </section>

            <section class="alignment-section">
                <h2>🔬 Submit Sequence Alignment</h2>
                
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="showTab('paste')">Paste Sequence</button>
                    <button class="tab-btn" onclick="showTab('file')">Upload File</button>
                </div>

                <div id="paste-tab" class="tab-content active">
                    <div class="form-group">
                        <label>Sequence (FASTA format or raw sequence)</label>
                        <textarea id="sequence-input" rows="10" placeholder=">seq1
ATCGATCGATCG"></textarea>
                    </div>
                </div>

                <div id="file-tab" class="tab-content">
                    <div class="form-group">
                        <label>Upload FASTA File for Alignment</label>
                        <input type="file" id="alignment-upload" accept=".fasta,.fa,.fna">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Sequence Type</label>
                        <select id="seq-type">
                            <option value="DNA">DNA</option>
                            <option value="PROTEIN">Protein</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>E-value Threshold</label>
                        <input type="number" id="evalue" value="10.0" step="0.1">
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="submitAlignment()">Submit Alignment</button>
                    <button class="btn btn-secondary" onclick="syncAlignment()">Quick Alignment (Sync)</button>
                </div>

                <div id="alignment-result" class="result-box"></div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Gene Sequence Alignment System. Powered by FastAPI, BLAST & MongoDB</p>
    </footer>

    <script src="/static/js/upload.js"></script>
</body>
</html>
