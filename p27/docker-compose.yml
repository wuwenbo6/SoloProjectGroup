version: '3.8'

services:
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: doc-qa-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - doc-qa-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    container_name: doc-qa-backend
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - TESSERACT_CMD=/usr/bin/tesseract
      - TESSERACT_LANG=chi_sim+eng
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - doc-qa-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: doc-qa-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - doc-qa-network
    restart: unless-stopped

volumes:
  es_data:

networks:
  doc-qa-network:
    driver: bridge
