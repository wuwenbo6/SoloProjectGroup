server:
  port: 8086

spring:
  application:
    name: collaboration-service
  redis:
    host: localhost
    port: 6379
    database: 1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

collaboration:
  session-timeout: 1800
  max-users-per-session: 10
  heartbeat-interval: 30