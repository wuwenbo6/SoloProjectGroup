server:
  port: 8085
  servlet:
    context-path: /api

spring:
  application:
    name: heritage-database-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/heritage_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.heritage.database.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

heritage:
  sync:
    enabled: true
    cron: "0 0 2 * * ?"
    external-api:
      url: https://api.industrial-heritage.org/data
      timeout: 30000
  cache:
    equipment-ttl: 3600