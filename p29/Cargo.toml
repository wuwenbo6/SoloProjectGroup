[package]
name = "dep-scanner"
version = "0.1.0"
edition = "2021"
description = "Dependency scanner and vulnerability detector for multiple languages"
license = "MIT"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
petgraph = "0.6"
rusqlite = { version = "0.29", features = ["bundled"] }
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
quick-xml = { version = "0.31", features = ["serialize"] }
walkdir = "2.0"
semver = "1.0"
