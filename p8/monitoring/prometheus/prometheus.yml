global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'core-service'
    static_configs:
      - targets: ['core-service:8080']
    metrics_path: '/metrics'

  - job_name: 'anomaly-detection'
    static_configs:
      - targets: ['anomaly-detection:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
