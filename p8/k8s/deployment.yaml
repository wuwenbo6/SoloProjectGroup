apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-core-service
  labels:
    app: iot-core-service
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: iot-core-service
  template:
    metadata:
      labels:
        app: iot-core-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - iot-core-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: iot-core-service
        image: iot-core-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: grpc
          containerPort: 50051
        env:
        - name: CONFIG_PATH
          value: "/app/configs/config.yaml"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: iot-secrets
              key: jwt-secret
        - name: INFLUXDB_TOKEN
          valueFrom:
            secretKeyRef:
              name: iot-secrets
              key: influxdb-token
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iot-secrets
              key: postgres-password
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /app/configs
        - name: backup-storage
          mountPath: /app/data/backups
      volumes:
      - name: config-volume
        configMap:
          name: iot-config
      - name: backup-storage
        persistentVolumeClaim:
          claimName: iot-backup-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: iot-core-service
spec:
  selector:
    app: iot-core-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 50051
    targetPort: 50051
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iot-core-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iot-core-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 20
        periodSeconds: 120
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-config
data:
  config.yaml: |
    server:
      http_port: 8080
      grpc_port: 50051
    influxdb:
      url: http://influxdb:8086
      org: iot-org
      bucket: iot-data
    postgresql:
      host: postgres
      port: 5432
      user: iot_user
      dbname: iot_db
    anomaly_detection:
      host: anomaly-detection
      port: 50052
    prometheus:
      port: 9090
    log:
      level: info
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iot-backup-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
---
apiVersion: v1
kind: Secret
metadata:
  name: iot-secrets
type: Opaque
stringData:
  jwt-secret: "change-this-to-your-super-secret-jwt-key-in-production"
  influxdb-token: "your-influxdb-token"
  postgres-password: "your-postgres-password"
