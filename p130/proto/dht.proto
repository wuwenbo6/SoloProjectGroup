syntax = "proto3";

package dht;

option go_package = "github.com/kademlia-dht/proto";

message FileMetadata {
  string file_id = 1;
  string file_name = 2;
  int64 file_size = 3;
  int32 chunk_count = 4;
  repeated string chunk_hashes = 5;
  string publisher = 6;
  bool encrypted = 7;
  string encrypted_aes_key = 8;
  string publisher_public_key = 9;
}

message PublishFileRequest {
  FileMetadata metadata = 1;
  bytes chunk_data = 2;
  int32 chunk_index = 3;
}

message PublishFileResponse {
  bool success = 1;
  string message = 2;
}

message FindNodeRequest {
  string target_id = 1;
}

message FindNodeResponse {
  repeated string contacts = 1;
}

message FindValueRequest {
  string file_id = 1;
}

message FindValueResponse {
  FileMetadata metadata = 1;
  repeated string providers = 2;
  repeated string contacts = 3;
}

message GetChunkRequest {
  string file_id = 1;
  int32 chunk_index = 2;
}

message GetChunkResponse {
  bytes data = 1;
  bool success = 2;
}

message PingRequest {
  string node_id = 1;
  string address = 2;
}

message PingResponse {
  string node_id = 1;
}

service DHTService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc FindNode(FindNodeRequest) returns (FindNodeResponse);
  rpc FindValue(FindValueRequest) returns (FindValueResponse);
  rpc PublishFile(PublishFileRequest) returns (PublishFileResponse);
  rpc GetChunk(GetChunkRequest) returns (GetChunkResponse);
}
