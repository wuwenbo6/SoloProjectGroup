version: '3.8'

services:
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: es-monitor
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - monitor-network

  redis:
    image: redis:7-alpine
    container_name: redis-monitor
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitor-network

  kibana:
    image: kibana:8.11.0
    container_name: kibana-monitor
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - monitor-network

volumes:
  es_data:
  redis_data:

networks:
  monitor-network:
    driver: bridge
