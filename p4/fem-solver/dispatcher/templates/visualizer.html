<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEM 结果可视化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 320px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }
        
        .sidebar h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #00d4ff;
            text-align: center;
        }
        
        .control-group {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
        }
        
        .control-group h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #00d4ff;
        }
        
        .form-group {
            margin-bottom: 12px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #ccc;
        }
        
        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #00d4ff33;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 0.9rem;
        }
        
        .form-group input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }
        
        .value-display {
            text-align: center;
            font-size: 1.1rem;
            color: #00d4ff;
            margin-top: 5px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00d4ff;
        }
        
        .viewport {
            flex: 1;
            position: relative;
        }
        
        #vtk-container {
            width: 100%;
            height: 100%;
        }
        
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            min-width: 200px;
        }
        
        .legend h4 {
            margin-bottom: 10px;
            color: #00d4ff;
        }
        
        .color-bar {
            width: 100%;
            height: 20px;
            background: linear-gradient(to right, 
                #313695, #4575b4, #74add1, #abd9e9, 
                #e0f3f8, #ffffbf, #fee090, #fdae61, 
                #f46d43, #d73027, #a50026);
            border-radius: 4px;
        }
        
        .legend-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 0.8rem;
            color: #ccc;
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9rem;
        }
        
        .info-panel p {
            margin: 5px 0;
        }
        
        .info-panel span {
            color: #00d4ff;
            font-weight: 500;
        }
        
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px 50px;
            border-radius: 10px;
            text-align: center;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #00d4ff33;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🔬 FEM 可视化</h1>
            
            <div class="control-group">
                <h3>📁 数据加载</h3>
                <div class="form-group">
                    <label>任务 ID</label>
                    <input type="text" id="taskId" placeholder="输入任务 ID...">
                </div>
                <button class="btn btn-primary" onclick="loadData()">加载结果</button>
            </div>
            
            <div class="control-group">
                <h3>🎨 可视化选项</h3>
                <div class="form-group">
                    <label>显示数据</label>
                    <select id="dataField" onchange="updateVisualization()">
                        <option value="displacement_mag">位移幅值</option>
                        <option value="displacement_x">X 方向位移</option>
                        <option value="displacement_y">Y 方向位移</option>
                        <option value="stress_xx">应力 XX</option>
                        <option value="stress_yy">应力 YY</option>
                        <option value="stress_xy">应力 XY</option>
                        <option value="von_mises">Von Mises 应力</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>变形缩放系数</label>
                    <input type="range" id="warpFactor" min="0" max="100" value="1" step="0.1" onchange="updateWarp()">
                    <div class="value-display" id="warpValue">1.0</div>
                </div>
                
                <div class="form-group">
                    <label>表面透明度</label>
                    <input type="range" id="opacity" min="0" max="100" value="100" onchange="updateOpacity()">
                    <div class="value-display" id="opacityValue">100%</div>
                </div>
            </div>
            
            <div class="control-group">
                <h3>📊 显示设置</h3>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="showEdges" checked onchange="updateEdges()">
                    <label>显示网格</label>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="showAxes" checked onchange="updateAxes()">
                    <label>显示坐标轴</label>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="showContours" onchange="updateContours()">
                    <label>等值线显示</label>
                </div>
            </div>
            
            <div class="control-group">
                <h3>✂️ 切片查看</h3>
                <div class="form-group">
                    <label>切片方向</label>
                    <select id="sliceDirection" onchange="updateSlice()">
                        <option value="none">无切片</option>
                        <option value="x">X 方向</option>
                        <option value="y">Y 方向</option>
                        <option value="z">Z 方向</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>切片位置</label>
                    <input type="range" id="slicePosition" min="-100" max="100" value="0" onchange="updateSlice()">
                    <div class="value-display" id="sliceValue">0.0</div>
                </div>
            </div>
        </div>
        
        <div class="viewport">
            <div id="vtk-container"></div>
            
            <div class="info-panel">
                <p>节点数: <span id="nodeCount">-</span></p>
                <p>单元数: <span id="elemCount">-</span></p>
                <p>最大值: <span id="maxValue">-</span></p>
                <p>最小值: <span id="minValue">-</span></p>
            </div>
            
            <div class="legend">
                <h4 id="legendTitle">Von Mises 应力</h4>
                <div class="color-bar"></div>
                <div class="legend-labels">
                    <span id="minLabel">min</span>
                    <span id="maxLabel">max</span>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vtk.js@28.3.1/dist/vtk.js"></script>
    <script>
        let renderWindow, renderer, interactor;
        let meshActor, sliceActor;
        let scalarData = null;
        let currentField = 'von_mises';
        
        function initVTK() {
            const container = document.getElementById('vtk-container');
            
            renderer = vtk.Rendering.Core.vtkRenderer.newInstance({
                background: [0.06, 0.09, 0.16]
            });
            
            renderWindow = vtk.Rendering.Core.vtkRenderWindow.newInstance();
            renderWindow.addRenderer(renderer);
            
            renderWindow.setContainer(container);
            
            interactor = vtk.Rendering.Core.vtkRenderWindowInteractor.newInstance();
            interactor.setView(renderWindow);
            
            const axes = vtk.Rendering.Core.vtkAxesActor.newInstance();
            axes.setXAxisLabelText('X');
            axes.setYAxisLabelText('Y');
            axes.setZAxisLabelText('Z');
            axes.setAxisLabels([0, 1, 2]);
            renderer.addActor(axes);
            
            const interactorStyle = vtk.Interaction.Style.vtkInteractorStyleTrackballCamera.newInstance();
            interactor.setInteractorStyle(interactorStyle);
            
            interactor.initialize();
            interactor.bindEvents(container);
            
            renderer.resetCamera();
            renderWindow.render();
        }
        
        async function loadData() {
            const taskId = document.getElementById('taskId').value.trim();
            if (!taskId) {
                alert('请输入任务 ID');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            
            try {
                const response = await fetch(`/api/visualization/${taskId}`);
                if (!response.ok) throw new Error('加载失败');
                
                const data = await response.json();
                createMesh(data);
                updateInfo(data);
            } catch (error) {
                alert('错误: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function createMesh(data) {
            if (meshActor) {
                renderer.removeActor(meshActor);
            }
            
            const points = vtk.Common.Core.vtkPoints.newInstance();
            const cells = vtk.Common.Core.vtkCellArray.newInstance();
            
            const nodes = data.nodes;
            const elements = data.elements;
            
            const nodeIds = Object.keys(nodes).map(Number).sort((a, b) => a - b);
            const nodeIdToIndex = {};
            nodeIds.forEach((id, index) => {
                nodeIdToIndex[id] = index;
                const coords = nodes[id];
                points.insertNextPoint(coords[0], coords[1], coords[2] || 0);
            });
            
            for (const elemId in elements) {
                const elem = elements[elemId];
                const elemNodeIds = elem.nodes.map(id => nodeIdToIndex[id]);
                
                if (elemNodeIds.length === 4) {
                    cells.insertNextCell(elemNodeIds);
                } else if (elemNodeIds.length === 3) {
                    cells.insertNextCell(elemNodeIds);
                }
            }
            
            const polyData = vtk.Common.DataModel.vtkPolyData.newInstance();
            polyData.setPoints(points);
            polyData.setPolys(cells);
            
            const displacements = data.displacements;
            const stresses = data.stresses || {};
            
            const scalars = new Float32Array(nodeIds.length);
            const pointData = polyData.getPointData();
            
            const dispX = new Float32Array(nodeIds.length);
            const dispY = new Float32Array(nodeIds.length);
            const dispMag = new Float32Array(nodeIds.length);
            
            nodeIds.forEach((id, index) => {
                const disp = displacements[id] || [0, 0];
                dispX[index] = disp[0];
                dispY[index] = disp[1];
                dispMag[index] = Math.sqrt(disp[0] * disp[0] + disp[1] * disp[1]);
            });
            
            const stressXx = new Float32Array(nodeIds.length);
            const stressYy = new Float32Array(nodeIds.length);
            const stressXy = new Float32Array(nodeIds.length);
            const vonMises = new Float32Array(nodeIds.length);
            
            for (let i = 0; i < nodeIds.length; i++) {
                stressXx[i] = 0;
                stressYy[i] = 0;
                stressXy[i] = 0;
                vonMises[i] = 0;
            }
            
            const elemIds = Object.keys(stresses).map(Number);
            elemIds.forEach(elemId => {
                const stress = stresses[elemId];
                const elem = elements[elemId];
                if (elem && elem.nodes) {
                    elem.nodes.forEach(nid => {
                        const idx = nodeIdToIndex[nid];
                        if (idx !== undefined) {
                            stressXx[idx] = stress[0];
                            stressYy[idx] = stress[1];
                            stressXy[idx] = stress[2];
                            vonMises[idx] = Math.sqrt(
                                stress[0] * stress[0] - stress[0] * stress[1] + 
                                stress[1] * stress[1] + 3 * stress[2] * stress[2]
                            );
                        }
                    });
                }
            });
            
            const dispXArray = vtk.Common.Core.vtkDataArray.newInstance({
                numberOfComponents: 1,
                values: dispX,
                name: 'displacement_x'
            });
            pointData.addArray(dispXArray);
            
            const dispYArray = vtk.Common.Core.vtkDataArray.newInstance({
                numberOfComponents: 1,
                values: dispY,
                name: 'displacement_y'
            });
            pointData.addArray(dispYArray);
            
            const dispMagArray = vtk.Common.Core.vtkDataArray.newInstance({
                numberOfComponents: 1,
                values: dispMag,
                name: 'displacement_mag'
            });
            pointData.addArray(dispMagArray);
            
            const stressXxArray = vtk.Common.Core.vtkDataArray.newInstance({
                numberOfComponents: 1,
                values: stressXx,
                name: 'stress_xx'
            });
            pointData.addArray(stressXxArray);
            
            const stressYyArray = vtk.Common.Core.vtkDataArray.newInstance({
                numberOfComponents: 1,
                values: stressYy,
                name: 'stress_yy'
            });
            pointData.addArray(stressYyArray);
            
            const stressXyArray = vtk.Common.Core.vtkDataArray.newInstance({
                numberOfComponents: 1,
                values: stressXy,
                name: 'stress_xy'
            });
            pointData.addArray(stressXyArray);
            
            const vonMisesArray = vtk.Common.Core.vtkDataArray.newInstance({
                numberOfComponents: 1,
                values: vonMises,
                name: 'von_mises'
            });
            pointData.addArray(vonMisesArray);
            
            pointData.setActiveScalars('von_mises');
            
            const mapper = vtk.Rendering.Core.vtkPolyDataMapper.newInstance();
            mapper.setInputData(polyData);
            mapper.setScalarVisibility(true);
            mapper.setColorModeToMapScalars();
            mapper.setScalarModeToUsePointFieldData();
            mapper.selectColorArray('von_mises');
            
            const lookupTable = vtk.Common.Core.vtkLookupTable.newInstance();
            lookupTable.setHueRange(0.66, 0);
            lookupTable.setSaturationRange(1, 1);
            lookupTable.setValueRange(1, 1);
            lookupTable.build();
            mapper.setLookupTable(lookupTable);
            
            meshActor = vtk.Rendering.Core.vtkActor.newInstance();
            meshActor.setMapper(mapper);
            
            const property = meshActor.getProperty();
            property.setEdgeVisibility(true);
            property.setEdgeColor(0, 0, 0);
            property.setLineWidth(1);
            
            renderer.addActor(meshActor);
            
            const warp = vtk.Filters.General.vtkWarpScalar.newInstance();
            warp.setInputData(polyData);
            warp.setScaleFactor(1);
            meshActor.getMapper().setInputConnection(warp.getOutputPort());
            meshActor.warpFilter = warp;
            
            const contour = vtk.Filters.Core.vtkContourFilter.newInstance();
            contour.setInputData(polyData);
            contour.setNumberOfContours(10);
            meshActor.contourFilter = contour;
            
            renderer.resetCamera();
            renderWindow.render();
            
            scalarData = {
                displacement_mag: dispMag,
                displacement_x: dispX,
                displacement_y: dispY,
                stress_xx: stressXx,
                stress_yy: stressYy,
                stress_xy: stressXy,
                von_mises: vonMises
            };
            
            updateLegend();
        }
        
        function updateVisualization() {
            if (!meshActor || !scalarData) return;
            
            currentField = document.getElementById('dataField').value;
            
            const mapper = meshActor.getMapper();
            mapper.selectColorArray(currentField);
            
            const warp = meshActor.warpFilter;
            if (currentField.startsWith('displacement')) {
                warp.setInputConnection(meshActor.warpFilter.getInputConnection());
            }
            
            updateLegend();
            renderWindow.render();
        }
        
        function updateWarp() {
            if (!meshActor) return;
            
            const factor = parseFloat(document.getElementById('warpFactor').value);
            document.getElementById('warpValue').textContent = factor.toFixed(1);
            
            if (meshActor.warpFilter) {
                meshActor.warpFilter.setScaleFactor(factor);
                renderWindow.render();
            }
        }
        
        function updateOpacity() {
            if (!meshActor) return;
            
            const opacity = parseInt(document.getElementById('opacity').value) / 100;
            document.getElementById('opacityValue').textContent = Math.round(opacity * 100) + '%';
            
            meshActor.getProperty().setOpacity(opacity);
            renderWindow.render();
        }
        
        function updateEdges() {
            if (!meshActor) return;
            
            const show = document.getElementById('showEdges').checked;
            meshActor.getProperty().setEdgeVisibility(show);
            renderWindow.render();
        }
        
        function updateAxes() {
        }
        
        function updateContours() {
            if (!meshActor || !meshActor.contourFilter) return;
            
            const show = document.getElementById('showContours').checked;
            meshActor.contourFilter.setEnabled(show);
            
            if (show) {
                const values = scalarData[currentField];
                const min = Math.min(...values);
                const max = Math.max(...values);
                
                const contours = [];
                for (let i = 0; i < 10; i++) {
                    contours.push(min + (max - min) * i / 9);
                }
                meshActor.contourFilter.setContourValues(contours);
            }
            
            renderWindow.render();
        }
        
        function updateSlice() {
            if (!meshActor) return;
            
            const direction = document.getElementById('sliceDirection').value;
            const position = parseFloat(document.getElementById('slicePosition').value) / 100;
            document.getElementById('sliceValue').textContent = position.toFixed(2);
            
            if (sliceActor) {
                renderer.removeActor(sliceActor);
                sliceActor = null;
            }
            
            if (direction !== 'none') {
                const plane = vtk.Common.DataModel.vtkPlane.newInstance();
                
                const bounds = meshActor.getMapper().getInputData().getBounds();
                const center = [
                    (bounds[0] + bounds[1]) / 2,
                    (bounds[2] + bounds[3]) / 2,
                    (bounds[4] + bounds[5]) / 2
                ];
                
                const normal = [0, 0, 0];
                if (direction === 'x') normal[0] = 1;
                else if (direction === 'y') normal[1] = 1;
                else normal[2] = 1;
                
                const pos = [
                    center[0] + position * (bounds[1] - bounds[0]) / 2,
                    center[1] + position * (bounds[3] - bounds[2]) / 2,
                    center[2] + position * (bounds[5] - bounds[4]) / 2
                ];
                
                plane.setOrigin(pos);
                plane.setNormal(normal);
                
                const cutter = vtk.Filters.Core.vtkCutter.newInstance();
                cutter.setCutFunction(plane);
                cutter.setInputConnection(meshActor.getMapper().getInputConnection());
                
                const sliceMapper = vtk.Rendering.Core.vtkPolyDataMapper.newInstance();
                sliceMapper.setInputConnection(cutter.getOutputPort());
                sliceMapper.setScalarVisibility(true);
                sliceMapper.setColorModeToMapScalars();
                sliceMapper.setScalarModeToUsePointFieldData();
                sliceMapper.selectColorArray(currentField);
                sliceMapper.setLookupTable(meshActor.getMapper().getLookupTable());
                
                sliceActor = vtk.Rendering.Core.vtkActor.newInstance();
                sliceActor.setMapper(sliceMapper);
                sliceActor.getProperty().setColor(1, 1, 1);
                sliceActor.getProperty().setLineWidth(2);
                
                renderer.addActor(sliceActor);
            }
            
            renderWindow.render();
        }
        
        function updateLegend() {
            if (!scalarData) return;
            
            const values = scalarData[currentField];
            const min = Math.min(...values);
            const max = Math.max(...values);
            
            document.getElementById('minLabel').textContent = min.toExponential(2);
            document.getElementById('maxLabel').textContent = max.toExponential(2);
            
            const fieldNames = {
                'displacement_mag': '位移幅值',
                'displacement_x': 'X 方向位移',
                'displacement_y': 'Y 方向位移',
                'stress_xx': '应力 XX',
                'stress_yy': '应力 YY',
                'stress_xy': '应力 XY',
                'von_mises': 'Von Mises 应力'
            };
            
            document.getElementById('legendTitle').textContent = fieldNames[currentField];
            
            document.getElementById('minValue').textContent = min.toExponential(3);
            document.getElementById('maxValue').textContent = max.toExponential(3);
        }
        
        function updateInfo(data) {
            document.getElementById('nodeCount').textContent = Object.keys(data.nodes).length;
            document.getElementById('elemCount').textContent = Object.keys(data.elements).length;
        }
        
        window.addEventListener('resize', () => {
            if (renderWindow) {
                renderWindow.resize();
            }
        });
        
        initVTK();
    </script>
</body>
</html>
