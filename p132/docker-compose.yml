version: '3.8'

services:
  modbus-mqtt-gateway:
    build: .
    container_name: modbus-mqtt-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/root/configs
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - emqx

  emqx:
    image: emqx/emqx:5.3.0
    container_name: emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8883:8883"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    restart: unless-stopped
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1

volumes:
  emqx-data:
  emqx-log:
