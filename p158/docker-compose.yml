version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: wifi-probe-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=wifi-analytics
      - DOCKER_INFLUXDB_INIT_BUCKET=probe-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=your-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  influxdb_data:
