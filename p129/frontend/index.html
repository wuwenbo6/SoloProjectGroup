<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Life Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; overflow: hidden; background: #000; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      z-index: 100;
    }
    #stats { margin-bottom: 15px; }
    .stat-item { margin: 5px 0; }
    .stat-label { color: #aaa; }
    #timeline {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      color: white;
      z-index: 100;
    }
    #timeline-slider { width: 100%; margin: 10px 0; }
    .controls { display: flex; gap: 10px; align-items: center; }
    button {
      padding: 8px 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #45a049; }
    button:disabled { background: #666; cursor: not-allowed; }
    #connection-status {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      border-radius: 4px;
      z-index: 100;
    }
    .connected { background: #4CAF50; color: white; }
    .disconnected { background: #f44336; color: white; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div id="ui">
    <h3>粒子生命模拟</h3>
    <div id="stats">
      <div class="stat-item"><span class="stat-label">总数:</span> <span id="total-particles">0</span></div>
      <div class="stat-item"><span class="stat-label">觅食:</span> <span id="foraging-particles">0</span></div>
      <div class="stat-item"><span class="stat-label">攻击:</span> <span id="attacking-particles">0</span></div>
      <div class="stat-item"><span class="stat-label">繁殖:</span> <span id="reproducing-particles">0</span></div>
      <div class="stat-item"><span class="stat-label">休眠:</span> <span id="sleeping-particles">0</span></div>
      <div class="stat-item"><span class="stat-label">平均能量:</span> <span id="average-energy">0</span></div>
    </div>
    <div class="controls">
      <button id="reset-btn">重置</button>
      <button id="pause-btn">暂停</button>
      <button id="add-energy-btn">添加能量</button>
    </div>
  </div>

  <div id="connection-status" class="disconnected">未连接</div>

  <div id="timeline">
    <h4>时间轴回放</h4>
    <input type="range" id="timeline-slider" min="0" max="100" value="0" disabled>
    <div class="controls">
      <button id="prev-frame-btn">◀</button>
      <button id="playback-btn" disabled>播放回放</button>
      <button id="next-frame-btn">▶</button>
      <button id="speed-btn">1x</button>
      <span id="playback-time">00:00</span>
      <span id="frame-info">无历史数据</span>
      <button id="load-history-btn">加载历史</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
