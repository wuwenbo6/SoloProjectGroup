server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mortise-tenon-system
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mortise_tenon_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

file:
  upload:
    path: /Users/wuwenbo/Documents/trae_projects/SoloProjectGroup/p31/uploads
    model-path: /Users/wuwenbo/Documents/trae_projects/SoloProjectGroup/p31/uploads/models
    document-path: /Users/wuwenbo/Documents/trae_projects/SoloProjectGroup/p31/uploads/documents

logging:
  level:
    com.mortise.tenon: debug
    org.springframework.web: info